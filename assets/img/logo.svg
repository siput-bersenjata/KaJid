<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E5B43"/>
      <stop offset="1" stop-color="#04150F"/>
    </linearGradient>
    <radialGradient id="gold" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#FFEDB0"/>
      <stop offset="0.45" stop-color="#F5C542"/>
      <stop offset="1" stop-color="#9A5B00"/>
    </radialGradient>
    <linearGradient id="cut" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E5B43"/>
      <stop offset="1" stop-color="#04150F"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)"/>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="none" stroke="#F5C542" stroke-opacity="0.35" stroke-width="1.5"/>
  <g filter="url(#soft)">
    <circle cx="29" cy="33" r="18" fill="url(#gold)"/>
    <circle cx="38" cy="26" r="15" fill="url(#cut)"/>
  </g>
  <ellipse cx="23" cy="23" rx="6.5" ry="3.4" fill="#fff" opacity="0.28" transform="rotate(-25 23 23)"/>
</svg>
